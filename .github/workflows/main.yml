name: Haskell CI

on:
  push:
    branches: [ 'main', 'ci' ]
  pull_request:
    branches: [ 'main' ]

# Pushing again to a branch that is still building leaves the earlier run
# occupying macOS slots to produce a result nobody will read, so supersede it.
# Not on main, though: that is the only place the cache is written, and a run
# cancelled partway never reaches the save step.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      # Two matrices, chosen by where the push landed.
      #
      # A push to ci is someone iterating on one of the checks below, and all
      # of them live on ubuntu 9.12, ubuntu 9.14 or the arm runner at 9.14 --
      # the sanitizers and valgrind on the first, the 32-bit and big-endian
      # harnesses on the second, the SSE flag on the third.  Running the other
      # ten jobs for that proves nothing and takes runner slots this account
      # needs elsewhere.  main and pull requests get the lot.
      #
      # Within the full matrix: GitHub runs at most five macOS jobs at once,
      # so seven of them held up the whole workflow.  ubuntu-24.04-arm is here
      # for the C rather than the compiler -- macOS already runs
      # cbits/aes/armv8.c but reaches it by a branch compiled out on Apple,
      # and the checks that read the auxiliary vector had no job at all.
      # Windows is two compilers for the same reason the other two are: the
      # Haskell it exercises is the same Haskell Linux runs seven times, and
      # what is particular to it is C that does not change with the compiler.
      matrix:
        include: >-
          ${{ fromJSON(github.ref == 'refs/heads/ci'
              && '[{"os":"ubuntu-latest","ghc":"9.12"},{"os":"ubuntu-latest","ghc":"9.14"},{"os":"ubuntu-24.04-arm","ghc":"9.14"}]'
              || '[{"os":"ubuntu-latest","ghc":"9.2"},{"os":"ubuntu-latest","ghc":"9.4"},{"os":"ubuntu-latest","ghc":"9.6"},{"os":"ubuntu-latest","ghc":"9.8"},{"os":"ubuntu-latest","ghc":"9.10"},{"os":"ubuntu-latest","ghc":"9.12"},{"os":"ubuntu-latest","ghc":"9.14"},{"os":"windows-latest","ghc":"9.2"},{"os":"windows-latest","ghc":"9.14"},{"os":"macOS-latest","ghc":"9.2"},{"os":"macOS-latest","ghc":"9.14"},{"os":"ubuntu-24.04-arm","ghc":"9.12"},{"os":"ubuntu-24.04-arm","ghc":"9.14"}]') }}

    env:
      cache-name: cabal-ghc
      # --enable-benchmarks so that `all` means all.  With benchmarks
      # disabled nothing ever compiled benchs/Bench.hs, and it sat broken
      # through a release cycle: taking a checked key made
      # ChaChaPoly1305.initialize total, and the throwCryptoError wrapped
      # around it stopped type-checking.  Enabling them costs tasty-bench
      # and random, both small and pure Haskell, and no running time --
      # `cabal test` does not run a benchmark.
      target-config: --test-show-details=streaming --enable-tests --enable-benchmarks

    steps:
    - run: git config --global core.autocrlf false

    - uses: actions/checkout@v5

    - uses: haskell-actions/setup@v2
      with:
        ghc-version: ${{ matrix.ghc }}
        cabal-version: latest

    - name: Cache Key
      id: params
      shell: bash
      run: |
        ghc_version=$(ghc --numeric-version)
        # The prefix is everything a cache may be shared across.  It
        # deliberately leaves out the .cabal hash: that changes whenever a
        # module is added or a bound is touched, and keying on it threw the
        # whole cache away each time.  restore-keys picks up the most recent
        # entry with this prefix instead, and cabal works out what is stale.
        # runner.arch, not just runner.os: the two Linux images share an os
        # but not a machine.  Without it both would key on Linux-...-<sha>,
        # the second save of a commit would be refused as a duplicate, and
        # each would restore the other's store and dist-newstyle -- built for
        # the wrong architecture and so of no use to it.
        # The package version, so that a branch building one version cannot
        # restore a cache saved by a branch building another.  restore-keys
        # matches on the prefix alone and caches saved from the default branch
        # are visible to every branch, so without this the 2.0 maintenance
        # branch picks up main's dist-newstyle, ends up with two crypton units
        # registered at once, and `cabal exec -- ghc -package crypton` cannot
        # say which one is meant.  Unlike the .cabal hash this changes once a
        # release rather than once an edit, so it costs a cold cache per
        # release and nothing in between.
        pkg_version=$(sed -n 's/^version:[[:space:]]*//p' crypton.cabal | head -1)
        prefix="${{ runner.os }}-${{ runner.arch }}-${{ env.cache-name }}-${ghc_version}-${pkg_version}-"
        echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
        echo "cache=${prefix}${{ github.sha }}" >> "$GITHUB_OUTPUT"
        echo "ghc_version=$ghc_version" >> "$GITHUB_OUTPUT"
        # Ask cabal where it keeps things rather than assuming ~/.cabal.
        # That is only the right answer when the legacy layout is in use --
        # cabal 3.12 and later move to XDG directories when ~/.cabal does not
        # already exist -- and it is never the right answer on Windows, which
        # is why no Windows job has ever saved a cache.  `cabal path` prints
        # without a trailing newline, hence the echo after each one.
        {
          echo "paths<<PATHS_EOF"
          cabal path --remote-repo-cache; echo
          cabal path --store-dir; echo
          echo "dist-newstyle"
          echo "PATHS_EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Restore Cache
      uses: actions/cache/restore@v5
      if: ${{ github.ref_name != 'ci-uc' }}
      with:
        # One entry per job rather than two.  The repository cache is capped
        # at 10 GB and eighteen jobs of dependencies already reach it, so build
        # products ride along with the dependencies instead of doubling the
        # number of entries.
        path: ${{ steps.params.outputs.paths }}
        key: ${{ steps.params.outputs.cache }}
        restore-keys: ${{ steps.params.outputs.prefix }}

    - name: Update the Hackage index
      run: cabal update

    # Try the restored cache first so a warm run does not talk to Hackage
    # at all, and fall back to fetching when it is cold or incomplete.
    - name: Install dependencies
      shell: bash
      run: |
        cabal build --offline --only-dependencies ${{ env.target-config }} all ||
          cabal build --only-dependencies ${{ env.target-config }} all

    - name: Build
      run: cabal build ${{ env.target-config }} all

    # Which implementation the C actually picked is invisible to the test
    # suite: when a runtime check answers no, everything still passes on the
    # Which of the instructions a job exercises depends on the machine it
    # landed on, and for the SHA extensions that differs between x86 runners
    # of the same label: nothing else in the log says which one this was.
    - name: Report the processor
      shell: bash
      continue-on-error: true
      run: |
        if [ -r /proc/cpuinfo ]; then
          grep -m1 -E 'model name|^Model' /proc/cpuinfo || true
          grep -m1 -E '^flags|^Features' /proc/cpuinfo | tr ' ' '\n' |
            grep -xE 'aes|pclmulqdq|avx2|sha_ni|sha512|pmull|sha1|sha2|sha3' |
            sort | tr '\n' ' '
          echo
        else
          sysctl -n machdep.cpu.brand_string || true
        fi

    # generic code, just slower.  So ask, and insist on the answer.
    #
    # Every image in the matrix is hardware that has AES and carry-less
    # multiply -- every x86-64 part since about 2010, and both AArch64 ones --
    # so anything less means crypton failed to reach for them, whether the
    # runtime check said no or the build never compiled the code.  Covers the
    # AES and PMULL checks; the SHA-2 one is not reported through this
    # interface.
    - name: Report the implementations crypton selected
      shell: bash
      run: |
        cat > ci-cpu-check.hs <<'EOF'
        import Crypto.System.CPU
        main = print processorOptions
        EOF
        # Compiled and linked rather than run through runghc: the answer comes
        # from a foreign call, and the bytecode interpreter cannot resolve
        # crypton_aes_cpu_init.  -i keeps the source tree we are standing in
        # from shadowing the built library, and -package crypton exposes it,
        # since cabal exec puts the project's package-db on the path without
        # exposing anything out of it.
        cabal exec --enable-tests --enable-benchmarks -- \
          ghc -v0 -O0 -i -package crypton ci-cpu-check.hs -o ci-cpu-check
        options=$(./ci-cpu-check 2>/dev/null || ./ci-cpu-check.exe)
        echo "processorOptions = $options"
        case "$options" in
          *AESNI*PCLMUL*) ;;
          *) echo "::error::expected AESNI and PCLMUL on ${{ matrix.os }}, got $options"
             exit 1 ;;
        esac

    - name: Run tests
      run: cabal test ${{ env.target-config }} all

    # The vendored assembly is x86-64 and AArch64 only, and every other
    # architecture -- i386, armv7, riscv64, ppc64le, s390x, loongarch64,
    # sparc64 -- takes the C beside it: crypton's own P-256 comb and window,
    # the curve arithmetic in cbits/crypton_ecc.c that P-384 and P-521 fall
    # back to, curve25519-donna and ed25519-donna.  Not one job above runs any
    # of it, because every machine in the matrix has the assembly and takes
    # it, so the tests walk past the C without touching it.  Changing the
    # first bit the comb reads makes this step fail forty-two examples and
    # leaves every job above passing, which is how far apart the two are.
    #
    # A build directory of its own: cabal does not recompile a C source when
    # only its cc-options change, so sharing dist-newstyle would link the
    # objects from the build above and measure nothing.  The dependencies come
    # from the store, which is cached, so this is the library and the tests
    # and nothing else.
    - name: The C every other architecture uses
      if: matrix.os == 'ubuntu-latest' && matrix.ghc == '9.14'
      run: >
        cabal test --builddir=dist-nos2n -f-support_s2n_bignum
        ${{ env.target-config }} all

    # #273: gcc before 13 does not understand target("+sha3") on aarch64 and
    # silently leaves the extension off, so an always_inline intrinsic that
    # needs it fails to inline and the build stops.  The runner's own gcc is
    # 13 and takes it, which is why nothing here ever saw the report.  gcc-12
    # is installed on purpose, and the library's C is built with it.
    - name: The compiler that could not build it
      if: matrix.os == 'ubuntu-24.04-arm' && matrix.ghc == '9.14'
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq gcc-12
        gcc-12 --version | head -1
        cat > /tmp/probe.c <<'PROBE'
        #include <arm_neon.h>
        #include <stdint.h>
        #include "crypton_armv8_target.h"
        CRYPTON_TARGET_ARMV8_SHA3
        static uint64x2_t r1(uint64x2_t a, uint64x2_t b) { return vxarq_u64(a, b, 20); }
        uint64_t use(uint64_t x) {
            uint64x2_t a = vdupq_n_u64(x), b = vdupq_n_u64(x + 1);
            return vgetq_lane_u64(r1(a, b), 0);
        }
        PROBE
        echo "--- the spelling this tree used to write, on gcc-12 ---"
        gcc-12 -O2 -DWITH_TARGET_ATTRIBUTES -Icbits -c -o /tmp/old.o \
          -D'CRYPTON_TARGET_ARMV8_SHA3=__attribute__((target("+sha3")))' \
          -include stdint.h -include arm_neon.h -x c - <<'OLD' \
          && echo "     unexpectedly accepted" || echo "     rejected, which is #273"
        __attribute__((target("+sha3")))
        static uint64x2_t r1(uint64x2_t a, uint64x2_t b) { return vxarq_u64(a, b, 20); }
        uint64_t use(uint64_t x) {
            uint64x2_t a = vdupq_n_u64(x), b = vdupq_n_u64(x + 1);
            return vgetq_lane_u64(r1(a, b), 0);
        }
        OLD
        echo "--- and what it writes now ---"
        gcc-12 -O2 -DWITH_TARGET_ATTRIBUTES -Icbits -c -o /tmp/new.o /tmp/probe.c \
          && echo "     accepted"
        echo "--- the whole library's C, with gcc-12 ---"
        for f in cbits/sha1_armv8.c cbits/sha256_armv8.c cbits/sha512_armv8.c \
                 cbits/sha3_armv8.c cbits/crypton_f2m.c; do
          gcc-12 -O2 -DWITH_TARGET_ATTRIBUTES -Icbits -Icbits/include64 \
            -c -o /tmp/o.o "$f" || { echo "FAILED $f"; exit 1; }
        done
        echo "     all built"

    # A primitive that falls off its accelerated path does not get a little
    # slower, it falls off a cliff, and no test notices because the answers
    # stay right.  #274 took SHA-256 from 3396 MB/s to 644 on an M4 and
    # shipped; it was found while measuring a table, not by anything here.
    #
    # Absolute throughput cannot be checked -- this runner is not the same
    # machine twice -- so what is checked is ratios between primitives
    # measured together.  The job then builds the library again with the AES
    # acceleration compiled out and requires that line to fail, since a run
    # where the measurement had stopped working would otherwise look like a
    # run where everything was fast.
    - name: A primitive fallen off its fast path
      if: matrix.os == 'ubuntu-latest' && matrix.ghc == '9.14'
      run: cbits/tests/perf/run.sh

    # Does what is published actually build?  A source distribution carries
    # only what the cabal file names, so a header that no field mentions is
    # simply absent from it, and the package fails for everyone downloading
    # it while building perfectly from a git checkout.  That is #270: 2.1.3
    # shipped without cbits/p256/p256_verify.h and could not be built at all
    # in the default configuration.
    #
    # Listing the tarball is not enough -- I did that before releasing and
    # saw nothing wrong.  It has to be unpacked somewhere else and built.
    - name: What is published, built from the tarball
      if: matrix.os == 'ubuntu-latest' && matrix.ghc == '9.14'
      run: |
        set -o pipefail
        cabal check
        cabal sdist --builddir=dist-sdist
        tar=$(ls dist-sdist/sdist/*.tar.gz)
        work=$(mktemp -d)
        tar xzf "$tar" -C "$work"
        cd "$work"/*/
        cabal build lib:crypton ${{ env.target-config }}

    # Generated bytes fed to the code that takes apart what comes off the
    # wire -- signatures, encoded points, AEAD lengths and tags.  Bounded to
    # half a minute each, which is not a campaign that will find much on its
    # own; what it is for is that a regression in this code stops being
    # something nobody would notice.  The first harness reads out of bounds
    # on a four-byte marker and has to be found, or the run explored nothing.
    # GCC 14 made -Wincompatible-pointer-types an error by default, and
    # nothing in this matrix is new enough to notice.  crypton 2.1.3 and
    # 2.1.4 both failed to build on Fedora 43 for exactly that reason -- a
    # declaration said `const uint32_t buf[16]` where every caller passes a
    # `const uint8_t *` -- while ubuntu-latest's gcc 13 made it a warning and
    # went on.  Reported as #282 after the release, as #273 was, and for the
    # same shape of reason: the compiler that would have caught it was in no
    # job here.
    #
    # The library's C is built again with gcc-14, through cabal so that the
    # flags are the ones the package actually sets.
    - name: The compiler stricter than this one
      if: matrix.os == 'ubuntu-latest' && matrix.ghc == '9.12'
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq gcc-14
        gcc-14 --version | head -1
        cabal build crypton --builddir=dist-gcc14 \
          --ghc-options="-pgmc gcc-14 -pgma gcc-14 -pgml gcc-14" \
          2>&1 | tee /tmp/gcc14.log | tail -40
        if grep -q "error:" /tmp/gcc14.log; then
          echo "::error::the C does not build with gcc-14"
          exit 1
        fi
        echo "ok   the C builds with a compiler that rejects what gcc 13 warns about"

    - name: Bytes nobody chose
      if: matrix.os == 'ubuntu-latest' && matrix.ghc == '9.12'
      run: CC=clang cbits/tests/fuzz/run.sh 30

    # What a secret leaves behind.  Round eight asked whether it can be read
    # from the time a primitive takes; this asks whether it can be read from
    # the memory afterwards, which a core file or a swapped page carries away
    # long after the caller believes it is done.  The first probe keeps the
    # secret on purpose and has to be found, or the search proved nothing.
    #
    # Not under the sanitizers: reading the stack below the current frame is
    # what this does, and ASan calls that an error.
    - name: What the secrets leave behind
      if: matrix.os == 'ubuntu-latest' && matrix.ghc == '9.12'
      run: cbits/tests/scrub/run.sh

    # The same answers on a machine whose bytes go the other way.  s390x and
    # ppc64 are among the architectures the cabal file builds for and neither
    # is in this matrix, so the eighteen files that read their input through
    # the loaders in crypton_align.h -- rewritten in #256 -- had never run
    # anywhere the byte order differs.  Only the C is taken over: qemu runs a
    # big-endian container, and what it must agree with is frozen in
    # cbits/tests/endian/vectors.txt rather than computed twice, since a
    # little-endian answer cannot be had on the machine doing the comparing.
    - name: The same answers on a big-endian machine
      if: matrix.os == 'ubuntu-latest' && matrix.ghc == '9.14'
      uses: docker/setup-qemu-action@v3
      with:
        platforms: s390x

    - name: Check the big-endian answers
      if: matrix.os == 'ubuntu-latest' && matrix.ghc == '9.14'
      run: |
        docker run --rm --platform linux/s390x -v "$PWD":/w -w /w s390x/ubuntu:24.04 \
          sh -c 'apt-get update -qq && apt-get install -y -qq gcc >/dev/null &&
                 cbits/tests/endian/run.sh'

    # Whether a secret ever decides a branch or an address.  valgrind is
    # told the private keys are undefined memory, which it already follows
    # through arithmetic, so it reports exactly the places one of them
    # reaches a conditional or an index.  The first driver is deliberately
    # leaky and has to report, or the rest of the run proves nothing.
    #
    # See cbits/tests/ct/README for what is marked and for why the AES
    # driver is expected to report.
    #
    # On both architectures: the drivers are the same C either way, but the
    # AES one is not -- it is run twice on AArch64, once against the tables
    # and once against the instructions, and the second must be silent.  That
    # arm did not exist until crypton's AArch64 AES and GHASH were rewritten
    # and it became clear this harness had never seen them.
    - name: What the secrets decide
      if: >-
        (matrix.os == 'ubuntu-latest' || matrix.os == 'ubuntu-24.04-arm')
        && matrix.ghc == '9.12'
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq valgrind
        cbits/tests/ct/run.sh

    # The three implementations that only a 32-bit architecture receives: the
    # P-256 field and its comb table under cbits/include32, the 32-bit donna,
    # and the 32-bit p448.  Nothing in this matrix is 32-bit, so none of them
    # was compiled anywhere, let alone run.  Each is asked the same questions
    # as the 64-bit one it stands in for, and the answers have to match; with
    # gcc-multilib the 32-bit side is then built again as a real 32-bit
    # binary, which is the only way to see what the narrower int, size_t and
    # pointer do to it.
    - name: The C only a 32-bit architecture gets
      if: matrix.os == 'ubuntu-latest' && matrix.ghc == '9.14'
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq gcc-multilib
        cbits/tests/width/run.sh

    # The arithmetic every build without GMP falls back to.  It is a separate
    # implementation of the same functions, reached by a flag nothing in CI
    # used to set, and it had gone its own way: a negative exponent sent the
    # exponentiation into a recursion that did not terminate, and a number of
    # bits was counted differently from the way GMP counts it.
    - name: The arithmetic without GMP
      if: matrix.os == 'ubuntu-latest' && matrix.ghc == '9.14'
      run: >
        cabal test --builddir=dist-nogmp -f-integer-gmp
        ${{ env.target-config }} all

    # -fgnu89-inline gives a bare inline in a header an external definition in
    # every translation unit that reads it, and one such definition had lost
    # its static.  Any architecture shows it; building is the whole of the
    # test, since the code itself is covered by every other job.
    - name: The old toolchain's inliner
      if: matrix.os == 'ubuntu-latest' && matrix.ghc == '9.14'
      run: >
        cabal build --builddir=dist-gnu89 -fold_toolchain_inliner
        ${{ env.target-config }} all

    # -fsupport_sse used to pull the SSE BLAKE2 and Argon2 sources in whatever
    # the architecture was, so it compiled only on x86.  This job is the one
    # that is not x86, which is the only place the flag can be told apart from
    # the arch(x86_64) beside it.
    - name: SSE asked for where there is none
      if: matrix.os == 'ubuntu-24.04-arm' && matrix.ghc == '9.14'
      run: >
        cabal build --builddir=dist-sse -fsupport_sse
        ${{ env.target-config }} all

    # What the C does with the lengths and indices it is handed.  Two left
    # shifts the standard leaves undefined were found this way and nothing
    # else; the value of the step from here on is that it stays that way.
    #
    # Only the C is instrumented -- the Haskell is compiled as usual and
    # linked against the sanitizer runtime, which is what -optl is for.
    # LeakSanitizer comes on with AddressSanitizer on Linux and would report
    # the whole of the GHC heap, which never frees, so it is turned off; what
    # is wanted here is the out-of-bounds half.
    #
    # A build directory of its own, because cabal does not recompile a C
    # source when only its cc-options change.
    - name: The C under the sanitizers
      if: matrix.os == 'ubuntu-latest' && matrix.ghc == '9.12'
      env:
        ASAN_OPTIONS: detect_leaks=0
        UBSAN_OPTIONS: print_stacktrace=1
      shell: bash
      run: |
        set -o pipefail
        san="-optc-fsanitize=address -optc-fsanitize=undefined"
        san="$san -optl-fsanitize=address -optl-fsanitize=undefined"
        cabal test --builddir=dist-san ${{ env.target-config }} all \
          --ghc-options="$san" 2>&1 | tee san.log
        # A report does not fail the run on its own: UndefinedBehaviorSanitizer
        # prints and carries on unless told otherwise, and carrying on is what
        # collects every one of them in a single run rather than the first.
        if grep -qE "runtime error|AddressSanitizer" san.log; then
          echo "::error::the sanitizers reported something; see the log above"
          exit 1
        fi

    # Saved after the build, so the entry holds the build products too, and
    # only from the default branch: a cache written on a branch is visible
    # only to that branch, while one written on the default branch is visible
    # to every branch and pull request.  Writing from pull requests as well
    # would multiply eighteen jobs by every open branch against a 10 GB cap.
    - name: Save Cache
      uses: actions/cache/save@v5
      if: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
      with:
        path: ${{ steps.params.outputs.paths }}
        key: ${{ steps.params.outputs.cache }}
