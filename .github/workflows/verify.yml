# Verification's exponentiation, GMP against the C, on the Arm runner: with
# a generated 48-limb squaring, does the C win at 3072 bits on a Neoverse
# too?  Runs on a push to this branch that touches this file.  (round 3)
name: verify

on:
  push:
    branches: [ci]
    paths: ['.github/workflows/verify.yml']

env:
  BRANCH: perf/mont-48-64

jobs:
  verify:
    runs-on: ubuntu-24.04-arm
    steps:
    - name: Which machine
      run: lscpu | grep -E 'Model name' || true

    - uses: actions/checkout@v5
      with: { ref: '${{ env.BRANCH }}', path: branch }
    - uses: actions/checkout@v5
      with: { path: ci }

    - uses: haskell-actions/setup@v2
      with:
        ghc-version: '9.12'
        cabal-version: latest

    # the same tree twice: as it ships, and with the C taking every size
    - name: Build both
      run: |
        cabal update -v0
        mkdir pub && cp ci/bench/verify/Pub.hs ci/bench/verify/pub.cabal pub/
        cd pub
        printf 'packages: . %s\n' "$GITHUB_WORKSPACE/branch" > def.project
        printf 'packages: . %s\npackage crypton\n  ghc-options: -optc-DCRYPTON_POWM_PUB_ALWAYS\n' "$GITHUB_WORKSPACE/branch" > always.project
        cabal build -v0 --project-file=def.project --builddir=dist-def
        cabal build -v0 --project-file=always.project --builddir=dist-always
        cp "$(cabal list-bin pubbench --project-file=def.project --builddir=dist-def)" ../pub-def
        cp "$(cabal list-bin pubbench --project-file=always.project --builddir=dist-always)" ../pub-always
        ! cmp -s "$(find dist-def -name crypton_powm.o)" "$(find dist-always -name crypton_powm.o)"
        ldd ../pub-def | grep -i gmp

    - name: Race them
      run: |
        for r in 1 2 3 4 5; do ./pub-def | sed 's/^/gmp /'; ./pub-always | sed 's/^/c /'; done |
          awk '{k=$2" "$1; if(!(k in m)||$3<m[k])m[k]=$3} END{for(k in m)print k, m[k]}' | sort -n
