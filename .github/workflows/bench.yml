# Temporary, for one table: crypton at this branch against OpenSSL on the
# machine the draw gives.  The README's x86-64 column is an EPYC 7763, so
# that is what this asks for and it stops in the first minute otherwise.
name: bench

on:
  workflow_dispatch:
  push:
    branches: [ 'bench/2.1.3-vs-openssl4' ]

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
    - name: which machine
      run: |
        grep -m1 'model name' /proc/cpuinfo
        if ! grep -q '7763' /proc/cpuinfo; then
          echo "::error::wanted the EPYC 7763, which is the machine in the README; re-run"
          exit 1
        fi

    - uses: actions/checkout@v5

    - uses: haskell-actions/setup@v2
      with:
        ghc-version: '9.12'
        cabal-version: latest

    - name: OpenSSL 4.0.2, built here
      run: |
        cd /tmp
        curl -sL -o o.tar.gz https://github.com/openssl/openssl/releases/download/openssl-4.0.2/openssl-4.0.2.tar.gz
        tar xzf o.tar.gz
        cd openssl-4.0.2
        ./Configure no-docs no-tests > /tmp/conf.log 2>&1
        make -j$(nproc) > /tmp/build.log 2>&1 || (tail -20 /tmp/build.log; exit 1)
        LD_LIBRARY_PATH=$PWD ./apps/openssl version

    - name: crypton, as cabal builds it
      run: |
        cabal build lib:crypton
        cc -O3 -I cbits -o /tmp/bulk bench/bulk.c \
          $(find dist-newstyle -path '*crypton-*/build/cbits*' -name '*.o')
        cd bench && cabal build --builddir=/tmp/pd exe:pkbench
        cp /tmp/pd/build/*/ghc-*/pkbench-0/x/pkbench/build/pkbench/pkbench /tmp/pkbench

    - name: the table
      run: |
        grep -m1 'model name' /proc/cpuinfo
        LD_LIBRARY_PATH=/tmp/openssl-4.0.2 \
          python3 bench/run.py /tmp/bulk /tmp/pkbench \
            /tmp/openssl-4.0.2/apps/openssl 3 "OpenSSL 4.0.2"
        echo
        echo "=== and the system OpenSSL, for the comparison with it"
        openssl version
        python3 bench/run.py /tmp/bulk /tmp/pkbench openssl 3 "OpenSSL 3.0.13"
